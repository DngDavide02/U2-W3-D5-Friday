<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backoffice Prodotti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/style.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      main {
        flex: 1;
      }

      .form-container {
        margin-top: 40px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        padding: 30px;
      }

      .form-label {
        font-weight: 600;
      }

      footer {
        margin-top: 50px;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">CRUDAZON</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link text-white" href="./index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link text-white active" href="#">Backoffice</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container">
      <h1 class="display-5 text-center mt-5">Gestione Prodotti</h1>
      <div class="form-container">
        <h2 class="h4 text-center mb-4" id="subtitle"></h2>
        <form id="backoffice-form">
          <div class="mb-3">
            <label for="name" class="form-label">Nome prodotto</label>
            <input type="text" class="form-control" id="name" required />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Descrizione</label>
            <textarea class="form-control" id="description" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="brand" class="form-label">Brand</label>
            <input type="text" class="form-control" id="brand" required />
          </div>
          <div class="mb-3">
            <label for="URL" class="form-label">URL immagine</label>
            <input type="url" class="form-control" id="URL" required />
          </div>
          <div class="mb-3">
            <label for="price" class="form-label">Prezzo (€)</label>
            <input type="number" class="form-control" id="price" step="0.01" required />
          </div>
          <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary w-48"><i class="bi bi-save"></i> Salva</button>
            <button id="reset-btn" type="button" class="btn btn-secondary w-48"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
            <button id="delete-btn" type="button" class="btn btn-danger w-48 d-none"><i class="bi bi-trash"></i> Elimina</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
      <div class="container">
        <p>&copy; 2025 CRUDAZON. All rights reserved.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.min.js"></script>
    <script src="./assets/backOffice.js"></script>
  </body>
</html>
